name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ArbiScanner.TelegramNotifierApp
          fetch-depth: 0

      - name: Checkout sibling ArbiScannerWebApp (cross-submodule project reference)
        uses: actions/checkout@v7
        with:
          repository: dimasdom/ArbiSpreadScanner.WebApp
          path: ArbiScannerWebApp

      - name: Checkout sibling ArbiScannerAdminPannel (cross-submodule project reference)
        uses: actions/checkout@v7
        with:
          repository: dimasdom/ArbiSpreadScanner.AdminPannel
          path: ArbiScannerAdminPannel

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # SonarCloud is free for public repos (no paid license needed); requires a SONAR_TOKEN
      # secret from the project's SonarCloud org, and /k /o below to match the imported project.
      - name: Set up JDK for SonarCloud
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarCloud scanner
        working-directory: ArbiScanner.TelegramNotifierApp
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Begin SonarCloud analysis
        working-directory: ArbiScanner.TelegramNotifierApp
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"dimasdom_ArbiSpreadScanner.TelegramNotifierApp"
          /o:"dimasdom"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.vstest.reportsPaths="TestResults/*.trx"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.projectBaseDir="$(pwd)"
          /d:sonar.exclusions="**/Program.cs,**/*.TelegramNotifierApp.Domain/Settings/**,**/*.TelegramNotifierApp.Infrastructure/DbContext/**,**/*.TelegramNotifierApp.Abstractions/Interfaces/**,**/ArbiScannerWebApp/**,**/ArbiScannerAdminPannel/**"

      # CodeQL is free for public GitHub repos, no external account/secrets needed.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          source-root: ArbiScanner.TelegramNotifierApp

      - name: Restore
        working-directory: ArbiScanner.TelegramNotifierApp
        run: dotnet restore ArbiScanner.slnx

      - name: Build (with analyzers)
        working-directory: ArbiScanner.TelegramNotifierApp
        run: dotnet build ArbiScanner.slnx --no-restore --configuration Release

      - name: Unit tests
        working-directory: ArbiScanner.TelegramNotifierApp
        run: >
          dotnet test ArbiScanner.TelegramNotifierApp.Tests/ArbiScanner.TelegramNotifierApp.Tests.csproj
          --no-restore --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./TestResults
          --collect:"XPlat Code Coverage;Format=opencover"

      - name: End SonarCloud analysis
        working-directory: ArbiScanner.TelegramNotifierApp
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        with:
          name: Test Results
          working-directory: ArbiScanner.TelegramNotifierApp
          path: "TestResults/*.trx"
          reporter: dotnet-trx
