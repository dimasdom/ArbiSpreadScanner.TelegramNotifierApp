name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ArbiScanner.TelegramNotifierApp

      - name: Checkout sibling ArbiScannerWebApp (cross-submodule project reference)
        uses: actions/checkout@v4
        with:
          repository: dimasdom/ArbiSpreadScanner.WebApp
          path: ArbiScannerWebApp

      - name: Checkout sibling ArbiScannerAdminPannel (cross-submodule project reference)
        uses: actions/checkout@v4
        with:
          repository: dimasdom/ArbiSpreadScanner.AdminPannel
          path: ArbiScannerAdminPannel

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: ArbiScanner.TelegramNotifierApp
        run: dotnet restore ArbiScanner.slnx

      - name: Build (with analyzers)
        working-directory: ArbiScanner.TelegramNotifierApp
        run: dotnet build ArbiScanner.slnx --no-restore --configuration Release

      - name: Unit tests
        working-directory: ArbiScanner.TelegramNotifierApp
        run: >
          dotnet test ArbiScanner.TelegramNotifierApp.Tests/ArbiScanner.TelegramNotifierApp.Tests.csproj
          --no-restore --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          working-directory: ArbiScanner.TelegramNotifierApp
          path: "TestResults/*.trx"
          reporter: dotnet-trx
