services:
  app:
    build:
      context: ../
      dockerfile: ArbiScanner.TelegramNotifierApp/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__PostgreSqlConnection: "Host=postgres;Port=5432;Database=ArbiScannerBot;Username=postgres;Password=REDACTED"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Queue: "spread_telegram"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      RabbitMq__Exchange: "spread_fanout_exchange"
      RabbitMq__RoutingKey: ""
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN}"
    networks:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REDACTED
      POSTGRES_DB: ArbiScannerBot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
